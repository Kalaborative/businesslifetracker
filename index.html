<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Life Asset Tracker</title>
  <link rel="apple-touch-icon" sizes="180x180" href="resources/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="resources/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="resources/assets/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="resources/assets/favicon.ico">
  <link rel="manifest" href="resources/assets/site.webmanifest">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sniglet&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sniglet', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 50%, #e0f7fa 100%);
      min-height: 100vh;
      color: #333;
    }

    /* ===== ONBOARDING ===== */
    #onboarding {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .onboarding-card {
      background: white;
      border-radius: 28px;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      text-align: center;
    }

    .onboarding-card h1 {
      font-size: 1.8rem;
      font-weight: 400;
      background: linear-gradient(135deg, #e91e63, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .onboarding-card .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .onboarding-card label {
      display: block;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 8px;
      color: #555;
    }

    .level-input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .level-input-wrap input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      font-size: 1.05rem;
      font-family: 'Sniglet', sans-serif;
      font-weight: 400;
      background: #fafafa;
      text-align: center;
      transition: border-color 0.2s;
    }

    .level-input-wrap input:focus {
      outline: none;
      border-color: #7c4dff;
    }

    .level-input-wrap .level-hint {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 6px;
    }

    .gold-preview {
      background: linear-gradient(135deg, #fff9c4, #ffe082);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      color: #6d4c00;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
    }

    .gold-preview .gold-amount {
      font-size: 1.4rem;
      font-weight: 400;
      color: #e65100;
    }

    .start-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 400;
      font-family: 'Sniglet', sans-serif;
      color: white;
      background: linear-gradient(135deg, #e91e63, #7c4dff);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(126, 77, 255, 0.3);
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(126, 77, 255, 0.4);
    }

    .start-btn:active {
      transform: translateY(0);
    }

    /* ===== TRACKER ===== */
    #tracker {
      display: none;
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
      animation: fadeIn 0.5s ease;
    }

    .tracker-header {
      text-align: center;
      margin-bottom: 6px;
    }

    .tracker-header h2 {
      font-size: 1.6rem;
      font-weight: 400;
      color: #555;
    }

    .gold-banner {
      background: linear-gradient(135deg, #fff9c4, #ffe082);
      border-radius: 18px;
      padding: 14px 20px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(255, 183, 0, 0.15);
    }

    .gold-banner .label {
      font-size: 1rem;
      color: #8d6e00;
      font-weight: 600;
    }

    .gold-banner .gold-remaining {
      font-size: 2.2rem;
      font-weight: 400;
      color: #e65100;
    }

    .gold-banner .gold-remaining .coin {
      font-size: 1.6rem;
      vertical-align: middle;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 10px;
      padding: 8px 18px;
      border: 2px solid #ccc;
      border-radius: 12px;
      background: white;
      font-family: 'Sniglet', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      color: #777;
      transition: border-color 0.2s, color 0.2s;
    }

    .back-btn:hover {
      border-color: #e91e63;
      color: #e91e63;
    }

    .counters-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .counters-wrap {
        grid-template-columns: 1fr;
      }
    }

    .counter-column {
      background: white;
      border-radius: 20px;
      padding: 16px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .counter-column .col-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }

    .counter-column .col-header img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 16px;
      margin-bottom: 6px;
    }

    .counter-column .col-header .gift-name {
      font-size: 1.3rem;
      font-weight: 400;
      color: #444;
    }

    .counter-column .col-header .gift-type {
      font-size: 0.9rem;
      font-weight: 600;
      color: #aaa;
    }

    .asset-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8f8fc;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 6px;
      transition: background 0.2s;
    }

    .asset-row.completed {
      background: #e8f5e9;
    }

    .asset-info {
      flex: 1;
      min-width: 0;
    }

    .asset-info .asset-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #444;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .asset-info .asset-level {
      font-size: 0.85rem;
      color: #aaa;
      font-weight: 600;
    }

    .asset-info .asset-prob {
      font-size: 0.85rem;
      color: #888;
      margin-top: 2px;
    }

    .asset-info .asset-prob .exp-prob {
      font-weight: 700;
      color: #7c4dff;
    }

    .asset-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .counter-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 400;
      font-family: 'Sniglet', sans-serif;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .counter-btn:active {
      transform: scale(0.9);
    }

    .counter-btn.minus {
      background: #ffcdd2;
      color: #c62828;
    }

    .counter-btn.minus:hover {
      background: #ef9a9a;
    }

    .counter-btn.plus {
      background: #c8e6c9;
      color: #2e7d32;
    }

    .counter-btn.plus:hover {
      background: #a5d6a7;
    }

    .counter-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .count-display {
      font-size: 1.15rem;
      font-weight: 400;
      min-width: 44px;
      text-align: center;
      color: #333;
    }

    .count-display .of-total {
      font-size: 0.8rem;
      color: #aaa;
      font-weight: 600;
    }

    .checkmark {
      color: #4caf50;
      font-size: 1.4rem;
      font-weight: 400;
      margin-left: 4px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #7c4dff, #e91e63);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- ONBOARDING -->
  <div id="onboarding">
    <div class="onboarding-card">
      <h1>Business Life</h1>
      <p class="subtitle">Asset Tracker for WePlay</p>

      <label for="goalLevel">What level are you aiming to achieve?</label>
      <div class="level-input-wrap">
        <input type="number" id="goalLevel" min="1" max="54" placeholder="Enter level (1-54)">
        <div class="level-hint" id="levelHint"></div>
      </div>

      <div class="gold-preview" id="goldPreview">
        <span>Select a level to see the gold needed</span>
      </div>

      <button class="start-btn" id="startBtn">Start Tracking</button>
    </div>
  </div>

  <!-- TRACKER -->
  <div id="tracker">
    <button class="back-btn" id="backBtn">&#8592; Change Goal</button>
    <div class="tracker-header">
      <h2 id="trackerTitle">Tracking to Level --</h2>
    </div>
    <div class="gold-banner">
      <div class="label">Gold Remaining</div>
      <div class="gold-remaining" id="goldRemaining"><span class="coin">&#x1FA99;</span> 0</div>
    </div>
    <div class="counters-wrap">
      <div class="counter-column" id="catColumn">
        <div class="col-header">
          <img src="lucky_cat.png" alt="Lucky Cat">
          <span class="gift-name">Lucky Cat</span>
          <span class="gift-type">Rides</span>
        </div>
        <div id="catAssets"></div>
      </div>
      <div class="counter-column" id="wolfColumn">
        <div class="col-header">
          <img src="lucky_wolf.png" alt="Lucky Wolf">
          <span class="gift-name">Lucky Wolf</span>
          <span class="gift-type">Collectibles</span>
        </div>
        <div id="wolfAssets"></div>
      </div>
    </div>
  </div>

  <script>
    // Asset data
    const tiers = [
      { levels: "1~3",   guarantee: 5,    probability: 50.00,  catItem: "Skateboard",         wolfItem: "Ticket Stubs" },
      { levels: "4~6",   guarantee: 10,   probability: 50.00,  catItem: "Bike",               wolfItem: "Lighter" },
      { levels: "7~9",   guarantee: 20,   probability: 10.00,  catItem: "Road Bike",          wolfItem: "Cups" },
      { levels: "10~12", guarantee: 25,   probability: 9.00,   catItem: "E-Bike",             wolfItem: "Jade Pot" },
      { levels: "13~15", guarantee: 40,   probability: 5.00,   catItem: "E-Motorcycle",       wolfItem: "Cellared Red Wine" },
      { levels: "16~18", guarantee: 80,   probability: 3.50,   catItem: "Motorcycle",         wolfItem: "Vintage Camera" },
      { levels: "19~21", guarantee: 120,  probability: 2.30,   catItem: "Racing-Motorcycle",  wolfItem: "Vintage Typewriter" },
      { levels: "22~24", guarantee: 150,  probability: 1.80,   catItem: "Sedan",              wolfItem: "Phonograph" },
      { levels: "25~27", guarantee: 180,  probability: 1.50,   catItem: "Convertible",        wolfItem: "Royal Badge (Silver)" },
      { levels: "28~30", guarantee: 210,  probability: 1.20,   catItem: "Racing Car",         wolfItem: "Royal Badge (Gold)" },
      { levels: "31~33", guarantee: 250,  probability: 0.70,   catItem: "Balloon Yacht",      wolfItem: "Silver Scale" },
      { levels: "34~36", guarantee: 290,  probability: 0.60,   catItem: "Ship",               wolfItem: "Gilded Clock" },
      { levels: "37~39", guarantee: 330,  probability: 0.40,   catItem: "Sea Train",          wolfItem: "Beethoven Manuscript" },
      { levels: "40~42", guarantee: 370,  probability: 0.35,   catItem: "Private Jet",        wolfItem: "Famous Painting" },
      { levels: "43~45", guarantee: 420,  probability: 0.30,   catItem: "Fight Aircraft",     wolfItem: "Royal Harp" },
      { levels: "46~48", guarantee: 470,  probability: 0.27,   catItem: "Fantasy Airship",    wolfItem: "Royal Piano" },
      { levels: "49~51", guarantee: 800,  probability: 0.20,   catItem: "Rocket",             wolfItem: "Crown" },
      { levels: "52~54", guarantee: 1200, probability: 0.15,   catItem: "UFO",                wolfItem: "Alien Civilization Relic" },
    ];

    const GOLD_PER_GIFT = 300;

    // State
    let goalTierIndex = -1;
    let catCounts = [];
    let wolfCounts = [];
    let totalGoldMax = 0;
    let currentGoldSpent = 0; // total gifts sent * 300

    // Elements
    const goalSelect = document.getElementById('goalLevel');
    const goldPreview = document.getElementById('goldPreview');
    const startBtn = document.getElementById('startBtn');
    const backBtn = document.getElementById('backBtn');
    const onboarding = document.getElementById('onboarding');
    const tracker = document.getElementById('tracker');
    const trackerTitle = document.getElementById('trackerTitle');
    const goldRemainingEl = document.getElementById('goldRemaining');
    const catAssetsEl = document.getElementById('catAssets');
    const wolfAssetsEl = document.getElementById('wolfAssets');

    const levelHint = document.getElementById('levelHint');

    // Find which tier index a given level falls into
    function getTierIndex(level) {
      for (let i = 0; i < tiers.length; i++) {
        const parts = tiers[i].levels.split('~');
        const lo = parseInt(parts[0]);
        const hi = parseInt(parts[1]);
        if (level >= lo && level <= hi) return i;
      }
      return -1;
    }

    function init() {
      goalSelect.addEventListener('input', onGoalChange);
      startBtn.addEventListener('click', onStart);
      backBtn.addEventListener('click', onBack);

      // Try to load saved state
      loadState();
    }

    function calcMaxGold(tierIndex) {
      let sum = 0;
      for (let i = 0; i <= tierIndex; i++) {
        sum += tiers[i].guarantee;
      }
      return sum * GOLD_PER_GIFT * 2; // x2 for cat and wolf
    }

    function onGoalChange() {
      const level = parseInt(goalSelect.value);
      if (isNaN(level) || level < 1 || level > 54) {
        goldPreview.innerHTML = '<span>Enter a level between 1 and 54</span>';
        levelHint.textContent = '';
        return;
      }
      const idx = getTierIndex(level);
      if (idx === -1) return;
      const gold = calcMaxGold(idx);
      levelHint.textContent = `Falls in range ${tiers[idx].levels} \u2014 includes ${idx + 1} asset tier${idx > 0 ? 's' : ''}`;
      goldPreview.innerHTML = `
        <span>Max gold to guarantee all assets up to Lv.${tiers[idx].levels.split('~')[1]}:</span>
        <span class="gold-amount">${gold.toLocaleString()} Gold</span>
      `;
    }

    function onStart() {
      const level = parseInt(goalSelect.value);
      if (isNaN(level) || level < 1 || level > 54) {
        alert('Please enter a level between 1 and 54!');
        return;
      }
      const idx = getTierIndex(level);
      if (idx === -1) return;
      goalTierIndex = idx;
      totalGoldMax = calcMaxGold(goalTierIndex);
      catCounts = new Array(goalTierIndex + 1).fill(0);
      wolfCounts = new Array(goalTierIndex + 1).fill(0);
      currentGoldSpent = 0;

      showTracker();
      saveState();
    }

    function onBack() {
      // Clear saved state
      localStorage.removeItem('bl_tracker_state');
      tracker.style.display = 'none';
      onboarding.style.display = 'flex';
    }

    function showTracker() {
      onboarding.style.display = 'none';
      tracker.style.display = 'block';

      const maxLvl = tiers[goalTierIndex].levels.split('~')[1];
      trackerTitle.textContent = `Tracking to Level ${maxLvl}`;

      renderAssets();
      updateGold();
    }

    function renderAssets() {
      catAssetsEl.innerHTML = '';
      wolfAssetsEl.innerHTML = '';

      for (let i = 0; i <= goalTierIndex; i++) {
        catAssetsEl.appendChild(createAssetRow('cat', i));
        wolfAssetsEl.appendChild(createAssetRow('wolf', i));
      }
    }

    function createAssetRow(type, tierIdx) {
      const tier = tiers[tierIdx];
      const counts = type === 'cat' ? catCounts : wolfCounts;
      const count = counts[tierIdx];
      const guarantee = tier.guarantee;
      const itemName = type === 'cat' ? tier.catItem : tier.wolfItem;
      const completed = count >= guarantee;

      // Experimental probability
      const expProb = count === 0 ? '0.00' : ((1 / (guarantee / count)) * 100).toFixed(2);
      // Actually: experimental = count / guarantee * theoreticalProb ...
      // But per the spec: "display the experimental probability by dividing the current counter by the guaranteed amount"
      // So exp = count / guarantee (as a fraction that represents progress, displayed as %)
      // Let's interpret: the theoretical prob is tier.probability%. The experimental is (count / guarantee) * 100% as a "how close to guarantee" measure
      // Re-reading: "display alongside it the experimental probability by dividing the current counter by the guaranteed amount"
      // This means: experimental_probability = count / guarantee (shown as percentage)
      const experimentalProb = ((count / guarantee) * 100).toFixed(2);

      const row = document.createElement('div');
      row.className = 'asset-row' + (completed ? ' completed' : '');
      row.id = `row-${type}-${tierIdx}`;

      row.innerHTML = `
        <div class="asset-info">
          <div class="asset-name">${itemName}</div>
          <div class="asset-level">Lv. ${tier.levels}</div>
          <div class="asset-prob">
            Theoretical: ${tier.probability}% &nbsp;|&nbsp;
            Experimental: <span class="exp-prob">${experimentalProb}%</span>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" style="width: ${Math.min(100, (count / guarantee) * 100)}%"></div>
          </div>
        </div>
        <div class="asset-counter">
          <button class="counter-btn minus" data-type="${type}" data-tier="${tierIdx}" ${count <= 0 ? 'disabled' : ''}>-</button>
          <div class="count-display">
            ${count}<br><span class="of-total">/ ${guarantee}</span>
          </div>
          <button class="counter-btn plus" data-type="${type}" data-tier="${tierIdx}" ${completed ? 'disabled' : ''}>+</button>
          ${completed ? '<span class="checkmark">&#10003;</span>' : ''}
        </div>
      `;

      // Bind events
      const minusBtn = row.querySelector('.counter-btn.minus');
      const plusBtn = row.querySelector('.counter-btn.plus');

      minusBtn.addEventListener('click', () => {
        if (counts[tierIdx] > 0) {
          counts[tierIdx]--;
          currentGoldSpent -= GOLD_PER_GIFT;
          refreshRow(type, tierIdx);
          updateGold();
          saveState();
        }
      });

      plusBtn.addEventListener('click', () => {
        if (counts[tierIdx] < guarantee) {
          counts[tierIdx]++;
          currentGoldSpent += GOLD_PER_GIFT;
          refreshRow(type, tierIdx);
          updateGold();
          saveState();
        }
      });

      return row;
    }

    function refreshRow(type, tierIdx) {
      const container = type === 'cat' ? catAssetsEl : wolfAssetsEl;
      const oldRow = document.getElementById(`row-${type}-${tierIdx}`);
      const newRow = createAssetRow(type, tierIdx);
      container.replaceChild(newRow, oldRow);
    }

    function updateGold() {
      const remaining = totalGoldMax - currentGoldSpent;
      goldRemainingEl.innerHTML = '<span class="coin">&#x1FA99;</span> ' + remaining.toLocaleString() + ' Gold';
    }

    // Persistence
    function saveState() {
      const state = {
        goalTierIndex,
        catCounts,
        wolfCounts,
        totalGoldMax,
        currentGoldSpent
      };
      localStorage.setItem('bl_tracker_state', JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem('bl_tracker_state');
      if (!raw) return;
      try {
        const state = JSON.parse(raw);
        goalTierIndex = state.goalTierIndex;
        catCounts = state.catCounts;
        wolfCounts = state.wolfCounts;
        totalGoldMax = state.totalGoldMax;
        currentGoldSpent = state.currentGoldSpent;
        goalSelect.value = parseInt(tiers[goalTierIndex].levels.split('~')[1]);
        onGoalChange();
        showTracker();
      } catch (e) {
        // ignore corrupt state
      }
    }

    init();
  </script>
</body>
</html>
